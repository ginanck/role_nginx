---

- name: Add the official nginx repository signing key
  ansible.builtin.get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /usr/share/keyrings/nginx-archive-keyring.asc
    owner: root
    group: root
    mode: '0644'
  when: nginx_use_official_repo | bool

- name: Add the official nginx repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.asc]
      https://nginx.org/packages/mainline/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} nginx
    filename: nginx
    state: present
    update_cache: true
  when: nginx_use_official_repo | bool
