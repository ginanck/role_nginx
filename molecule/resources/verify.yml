---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: test_ac1_live_configuration_is_valid
      ansible.builtin.command:
        cmd: nginx -t -c /etc/nginx/nginx.conf
      changed_when: false
      register: nginx_syntax

    - name: test_ac2_promoted_config_matches_candidate
      ansible.builtin.slurp:
        src: /etc/nginx/vhost.d/vhost_molecule.conf
      register: live_vhost

    - name: test_ac2_candidate_config
      ansible.builtin.slurp:
        src: /var/lib/nginx/candidate/vhost.d/vhost_molecule.conf
      register: candidate_vhost

    - name: test_ac2_assert_promoted_equals_candidate
      ansible.builtin.assert:
        that:
          - live_vhost.content == candidate_vhost.content
        fail_msg: "the live vhost must equal the validated candidate"

    - name: test_ac4_tls_protocols_are_declared
      ansible.builtin.assert:
        that:
          - "'ssl_protocols' in (live_vhost.content | b64decode)"
        fail_msg: "the vhost must declare an explicit TLS protocol set"

    - name: test_ac5_redirect_and_hsts_are_declared
      ansible.builtin.assert:
        that:
          - "'return       301 https://$host$request_uri;' in (live_vhost.content | b64decode)"
          - "'Strict-Transport-Security' in (live_vhost.content | b64decode)"
        fail_msg: "the vhost must redirect to HTTPS and send HSTS"

    - name: test_ac6_server_tokens_is_off
      ansible.builtin.slurp:
        src: /etc/nginx/http.conf
      register: live_http

    - name: test_ac6_assert_server_tokens
      ansible.builtin.assert:
        that:
          - "'server_tokens       off;' in (live_http.content | b64decode)"
        fail_msg: "server_tokens must be off"

    - name: test_ac7_certificate_mode
      ansible.builtin.stat:
        path: /etc/nginx/certs/deployed.crt
      register: deployed_cert

    - name: test_ac7_assert_certificate_mode
      ansible.builtin.assert:
        that:
          - deployed_cert.stat.exists
          - deployed_cert.stat.mode == '0640'
        fail_msg: "declared certificates must be deployed with mode 0640"

    - name: test_ac8_tls_extras_are_rendered
      ansible.builtin.assert:
        that:
          - "'ssl_session_tickets' in (live_vhost.content | b64decode)"
        fail_msg: "the vhost must render the TLS session ticket setting"

    - name: test_ac9_acme_challenge_location
      ansible.builtin.assert:
        that:
          - "'.well-known/acme-challenge/' in (live_vhost.content | b64decode)"
        fail_msg: "the ACME challenge location must be rendered"

    - name: test_ac11_rate_limit_zone_and_gzip
      ansible.builtin.assert:
        that:
          - "'limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;' in (live_http.content | b64decode)"
          - "'gzip on;' in (live_http.content | b64decode)"
        fail_msg: "declared rate limit zones and gzip must be rendered"

    - name: test_ac13_proxy_cache_is_rendered
      ansible.builtin.assert:
        that:
          - "'proxy_cache_path /var/cache/nginx/proxy' in (live_http.content | b64decode)"
          - "'proxy_cache proxy_cache;' in (live_vhost.content | b64decode)"
        fail_msg: "the proxy cache path and location reference must be rendered"

    - name: test_ac11_logrotate_policy
      ansible.builtin.stat:
        path: /etc/logrotate.d/nginx
      register: nginx_logrotate

    - name: test_ac11_assert_logrotate_policy
      ansible.builtin.assert:
        that:
          - nginx_logrotate.stat.exists
        fail_msg: "the log rotation policy must be installed"

    - name: test_ac3_service_is_running
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      changed_when: false
      register: nginx_active

    - name: test_ac3_assert_service_state
      ansible.builtin.assert:
        that:
          - nginx_active.stdout | trim == 'active'
        fail_msg: "nginx must be running"
